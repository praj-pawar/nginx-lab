<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="An HTTP request nested inside a TCP segment nested inside an IP packet. An L4 proxy reads only the outer layers, an L7 proxy opens the HTTP inside." font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="la" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="currentColor"/>
    </marker>
  </defs>

  <!-- ip packet -->
  <rect x="40" y="40" width="560" height="240" rx="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="60" y="72" font-size="15" font-weight="600" fill="currentColor">ip packet</text>
  <text x="580" y="72" font-size="12.5" fill="currentColor" opacity="0.65" text-anchor="end">addresses</text>

  <!-- tcp segment -->
  <rect x="70" y="90" width="500" height="160" rx="9" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.85"/>
  <text x="90" y="121" font-size="15" font-weight="600" fill="currentColor">tcp segment</text>
  <text x="550" y="121" font-size="12.5" fill="currentColor" opacity="0.65" text-anchor="end">ports, connection state</text>

  <!-- http request -->
  <rect x="100" y="140" width="440" height="80" rx="8" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="120" y="172" font-size="15" font-weight="600" fill="#60a5fa">http request</text>
  <text x="520" y="172" font-size="12.5" fill="currentColor" opacity="0.65" text-anchor="end">method, path, headers</text>
  <text x="120" y="199" font-size="12.5" fill="currentColor" opacity="0.55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /hello · Host: localhost</text>

  <!-- l4 callout -->
  <text x="755" y="106" font-size="14" fill="currentColor" text-anchor="middle">an <tspan font-weight="600">l4 proxy</tspan> reads this far,</text>
  <text x="755" y="126" font-size="14" fill="currentColor" text-anchor="middle">forwards the payload unopened</text>
  <line x1="662" y1="112" x2="582" y2="130" stroke="currentColor" stroke-width="1.2" marker-end="url(#la)"/>

  <!-- l7 callout -->
  <text x="755" y="196" font-size="14" fill="currentColor" text-anchor="middle">an <tspan font-weight="600" fill="#60a5fa">l7 proxy</tspan> opens this</text>
  <text x="755" y="216" font-size="14" fill="currentColor" text-anchor="middle">and reads the http inside</text>
  <line x1="668" y1="202" x2="552" y2="185" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#la)"/>
</svg>
