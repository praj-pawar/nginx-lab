<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="A production request path: client to an L4 anycast entry point, to an L7 application load balancer, to a pod. Each hop makes its own decisions about headers, health checks, timeouts and retries." font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="pa" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="currentColor"/>
    </marker>
  </defs>

  <circle cx="62" cy="100" r="7" fill="currentColor"/>
  <text x="62" y="135" font-size="13" fill="currentColor" opacity="0.7" text-anchor="middle">client</text>

  <line x1="78" y1="100" x2="128" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa)"/>

  <rect x="135" y="58" width="200" height="84" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="235" y="93" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">anycast entry · l4</text>
  <text x="235" y="117" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">stable address, absorbs floods</text>

  <line x1="335" y1="100" x2="393" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="364" y="88" font-size="11.5" fill="currentColor" opacity="0.6" text-anchor="middle">tcp</text>

  <rect x="400" y="58" width="240" height="84" rx="10" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="520" y="93" font-size="15" font-weight="600" fill="#60a5fa" text-anchor="middle">load balancer · l7</text>
  <text x="520" y="117" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">tls ends · path routing · headers</text>

  <line x1="640" y1="100" x2="698" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="669" y="88" font-size="11.5" fill="currentColor" opacity="0.6" text-anchor="middle">http</text>

  <rect x="705" y="58" width="140" height="84" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="775" y="93" font-size="15" font-weight="600" fill="currentColor" text-anchor="middle">pod</text>
  <text x="775" y="117" font-size="12" fill="currentColor" opacity="0.7" text-anchor="middle">your app</text>

  <text x="450" y="192" font-size="13" fill="currentColor" opacity="0.65" text-anchor="middle">every hop makes its own decisions about headers, health checks, timeouts and retries</text>
</svg>
