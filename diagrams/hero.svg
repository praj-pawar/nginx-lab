<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="One reverse proxy between clients and three backends. Picking a backend makes it a load balancer, enforcing policy makes it an API gateway." font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="currentColor"/>
    </marker>
  </defs>

  <!-- clients -->
  <g fill="currentColor">
    <circle cx="85" cy="120" r="7"/>
    <circle cx="85" cy="180" r="7"/>
    <circle cx="85" cy="240" r="7"/>
  </g>
  <text x="85" y="280" text-anchor="middle" font-size="14" fill="currentColor" opacity="0.7">clients</text>

  <!-- connection 1 arrows -->
  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#a)">
    <line x1="100" y1="120" x2="268" y2="120"/>
    <line x1="100" y1="180" x2="268" y2="180"/>
    <line x1="100" y1="240" x2="268" y2="240"/>
  </g>
  <text x="184" y="168" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">connection 1</text>

  <!-- proxy -->
  <rect x="275" y="96" width="260" height="168" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="405" y="172" text-anchor="middle" font-size="18" font-weight="600" fill="currentColor">reverse proxy</text>
  <text x="405" y="198" text-anchor="middle" font-size="13.5" fill="currentColor" opacity="0.7">terminates, then reconnects</text>

  <!-- connection 2 arrows -->
  <g stroke="currentColor" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <line x1="535" y1="150" x2="648" y2="119"/>
    <line x1="535" y1="180" x2="648" y2="180"/>
    <line x1="535" y1="210" x2="648" y2="241"/>
  </g>
  <text x="592" y="166" text-anchor="middle" font-size="12" fill="currentColor" opacity="0.65">connection 2</text>

  <!-- backends -->
  <g fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.9">
    <rect x="655" y="97" width="170" height="44" rx="8"/>
    <rect x="655" y="158" width="170" height="44" rx="8"/>
    <rect x="655" y="219" width="170" height="44" rx="8"/>
  </g>
  <g fill="currentColor" font-size="14.5" text-anchor="middle">
    <text x="740" y="124">backend 1</text>
    <text x="740" y="185">backend 2</text>
    <text x="740" y="246">backend 3</text>
  </g>

  <!-- job titles -->
  <line x1="405" y1="62" x2="405" y2="88" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="405" y="48" text-anchor="middle" font-size="15" fill="currentColor">picks a backend?  <tspan fill="#60a5fa" font-weight="600">load balancer</tspan></text>

  <line x1="405" y1="272" x2="405" y2="300" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <text x="405" y="322" text-anchor="middle" font-size="15" fill="currentColor">enforces policy?  <tspan fill="#60a5fa" font-weight="600">api gateway</tspan></text>
</svg>
