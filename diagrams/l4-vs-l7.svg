<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="The same request sent to an L7 port and an L4 port. The L7 proxy routes on the path to one backend and adds a forwarding header. The L4 proxy never reads the path and round robins across all three backends." font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="va" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="currentColor"/>
    </marker>
    <marker id="vb" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,4 0,8" fill="#60a5fa"/>
    </marker>
  </defs>

  <text x="450" y="28" font-size="14.5" fill="currentColor" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">GET /only-backend-1</text>
  <text x="450" y="48" font-size="12.5" fill="currentColor" opacity="0.6" text-anchor="middle">the same request, sent to both ports</text>

  <!-- ===== L7 panel ===== -->
  <circle cx="75" cy="150" r="7" fill="currentColor"/>
  <line x1="90" y1="150" x2="193" y2="150" stroke="currentColor" stroke-width="1.5" marker-end="url(#va)"/>

  <rect x="200" y="105" width="210" height="90" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="305" y="143" font-size="15.5" font-weight="600" fill="currentColor" text-anchor="middle">l7 · http block :8080</text>
  <text x="305" y="168" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">opens the request</text>

  <line x1="410" y1="130" x2="648" y2="107" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#vb)"/>
  <text x="530" y="102" font-size="12.5" fill="#60a5fa" text-anchor="middle">path matched · x-forwarded-for added</text>

  <g text-anchor="middle" font-size="14">
    <rect x="655" y="85" width="170" height="42" rx="8" fill="none" stroke="#60a5fa" stroke-width="1.6"/>
    <text x="740" y="111" fill="#60a5fa" font-weight="600">backend 1</text>
    <rect x="655" y="140" width="170" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.4"/>
    <text x="740" y="166" fill="currentColor" opacity="0.4">backend 2</text>
    <rect x="655" y="195" width="170" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-dasharray="4 4" opacity="0.4"/>
    <text x="740" y="221" fill="currentColor" opacity="0.4">backend 3</text>
  </g>

  <!-- divider -->
  <line x1="60" y1="262" x2="840" y2="262" stroke="currentColor" stroke-width="1" stroke-dasharray="2 6" opacity="0.35"/>

  <!-- ===== L4 panel ===== -->
  <circle cx="75" cy="345" r="7" fill="currentColor"/>
  <line x1="90" y1="345" x2="193" y2="345" stroke="currentColor" stroke-width="1.5" marker-end="url(#va)"/>

  <rect x="200" y="300" width="210" height="90" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="305" y="338" font-size="15.5" font-weight="600" fill="currentColor" text-anchor="middle">l4 · stream block :9090</text>
  <text x="305" y="363" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">moves bytes</text>

  <g stroke="currentColor" stroke-width="1.5" marker-end="url(#va)">
    <line x1="410" y1="322" x2="648" y2="303"/>
    <line x1="410" y1="345" x2="648" y2="358"/>
    <line x1="410" y1="368" x2="648" y2="413"/>
  </g>
  <text x="530" y="296" font-size="12.5" fill="currentColor" opacity="0.7" text-anchor="middle">path never read · round robin</text>

  <g text-anchor="middle" font-size="14" fill="currentColor">
    <rect x="655" y="281" width="170" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="740" y="307">backend 1</text>
    <rect x="655" y="336" width="170" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="740" y="362">backend 2</text>
    <rect x="655" y="391" width="170" height="42" rx="8" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <text x="740" y="417">backend 3</text>
  </g>
</svg>
