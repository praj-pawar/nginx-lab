# Lab 1 — the most naive reverse proxy that works.
#
# Deliberately incomplete: it forwards requests but tells the backend nothing
# about who really sent them. We run it, observe the damage, then fix it.
#
# Run with:
#   nginx -p /Users/prajwal/nginx-lab/labs/01-reverse-proxy -c nginx.conf

worker_processes 1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log logs/access.log;

    # Keep every scratch path inside this lab directory. This is why we never
    # need sudo: nothing is written to /opt/homebrew/var.
    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    server {
        listen      8080;
        server_name localhost;

        location / {
            # This single line is the whole reverse proxy.
            # nginx accepts your connection, then makes its OWN, separate
            # connection to 127.0.0.1:3001 and relays between the two.
            proxy_pass http://127.0.0.1:3001;
        }
    }
}
