# Lab 1, corrected — the standard reverse-proxy header block, explained.
#
# Diff against nginx.conf to see exactly what changed:
#   diff -u nginx.conf nginx-fixed.conf
#
# Run with:
#   nginx -p ~/nginx-lab/labs/01-reverse-proxy -c ~/nginx-lab/labs/01-reverse-proxy/nginx-fixed.conf

worker_processes 1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log logs/access.log;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    server {
        listen      8080;
        server_name localhost;

        location / {
            proxy_pass http://127.0.0.1:3001;

            # --- The repair kit -------------------------------------------
            # Each line below fixes something nginx's defaults destroyed.

            # Preserve the hostname the CLIENT asked for, instead of nginx's
            # default ($proxy_host = "127.0.0.1:3001"). Fixes redirects,
            # password-reset emails, OAuth callbacks, multi-tenant routing.
            # $host      = hostname only, port stripped  -> "localhost"
            # $http_host = raw Host header, port included -> "localhost:8080"
            # Use $http_host if your backend needs the port.
            proxy_set_header Host $host;

            # The immediate peer's IP — the client, since we are the edge.
            # Single value, never a list, so it cannot be spoofed into a chain.
            proxy_set_header X-Real-IP $remote_addr;

            # The conventional chain. $proxy_add_x_forwarded_for expands to
            # "<incoming XFF>, $remote_addr" — or just $remote_addr if absent.
            # WARNING: it appends to whatever the client sent, so a client can
            # inject fake entries. Only the RIGHTMOST entries, added by proxies
            # you control, are trustworthy. See the realip note below.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Did the CLIENT use TLS? The backend can't tell: TLS terminated on
            # connection 1 and this hop is plaintext. Becomes real in Lab 4.
            proxy_set_header X-Forwarded-Proto $scheme;

            # Original host+port, kept separately because $host drops the port.
            proxy_set_header X-Forwarded-Host $http_host;

            # --- Upstream keepalive ---------------------------------------
            # nginx defaults to HTTP/1.0 + "Connection: close" upstream, so it
            # opens a NEW TCP connection for every single proxied request.
            # These two lines enable HTTP/1.1 keepalive. Real pooling also needs
            # an `upstream` block with `keepalive N` — that arrives in Lab 2.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
