# Lab 2 — one backend becomes three. The reverse proxy starts CHOOSING.
#
# Everything here is Lab 1's fixed config plus an `upstream` block.
# That is the entire difference between "reverse proxy" and "load balancer".
#
# Run with:
#   nginx -p ~/nginx-lab/labs/02-load-balancer -c ~/nginx-lab/labs/02-load-balancer/nginx.conf

worker_processes 1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    # Custom log format so balancing decisions are VISIBLE.
    # $upstream_addr        = which backend nginx actually picked
    # $upstream_status      = what that backend returned
    # $upstream_response_time = how long it took
    # On a retry, nginx logs BOTH backends here, comma-separated — which is how
    # you see failover happen in Lab 2's second half.
    log_format lb '$request  ->  upstream=$upstream_addr  '
                  'status=$status upstream_status=$upstream_status  '
                  'ut=$upstream_response_time';
    access_log logs/access.log lb;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    upstream backend_pool {
        # No algorithm directive = ROUND ROBIN, nginx's default.
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;

        # Keep up to 16 idle connections to upstreams open for reuse.
        # THIS is what makes the "proxies improve performance via connection
        # pooling" claim true — without it nginx opens a fresh TCP connection
        # per request. Requires proxy_http_version 1.1 below.
        keepalive 16;

        # --- Other algorithms: comment out the servers above? No — just add
        # --- one of these lines INSIDE this block to change the strategy.
        #
        # least_conn;            # fewest active connections wins. Best when
        #                        # request durations vary a lot (our DELAY_MS).
        #
        # ip_hash;               # same client IP -> same backend. Sticky, but
        #                        # NOT consistent hashing: adding/removing a
        #                        # server reshuffles most keys.
        #
        # hash $request_uri consistent;   # real consistent hashing (ketama).
        #                        # Adding a 4th server moves ~1/4 of keys
        #                        # instead of nearly all of them.
        #
        # random two least_conn; # pick 2 at random, take the less busy one.
        #                        # Surprisingly good, cheap, avoids herding.
    }

    server {
        listen      8080;
        server_name localhost;

        location / {
            # NOTE: proxy_pass now names the upstream BLOCK, not a host:port.
            # Which means $proxy_host is literally "backend_pool" — not a
            # resolvable hostname at all. This is why `Host $host` below is
            # no longer merely nice-to-have but mandatory.
            proxy_pass http://backend_pool;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
