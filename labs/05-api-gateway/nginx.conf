# Lab 5 — the same reverse proxy, now enforcing POLICY. That is all an
# "API gateway" is.
#
#   nginx -p ~/nginx-lab/labs/05-api-gateway -c ~/nginx-lab/labs/05-api-gateway/nginx.conf

worker_processes 1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format gw '$request -> upstream=$upstream_addr status=$status '
                  'limit_req_status=$limit_req_status';
    access_log logs/access.log gw;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    # --- POLICY 1: rate limiting -------------------------------------------
    # A leaky bucket keyed on client IP. 2 requests/second sustained.
    # 10m of shared memory holds ~80k states on 64-bit builds (128 bytes each).
    # Note the key is $binary_remote_addr — the CLIENT, which only works
    # because we are the edge. Behind another proxy you would key on
    # $http_x_forwarded_for, with all the spoofing caveats that implies.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=2r/s;

    # --- POLICY 2: response caching ----------------------------------------
    proxy_cache_path cache levels=1:2 keys_zone=apicache:10m max_size=100m
                     inactive=60s use_temp_path=off;

    upstream api_pool {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
        keepalive 16;
    }

    # Shared proxy headers. Repeated per location because proxy_set_header is
    # replace-not-merge — defining any one in a location drops all inherited.
    # Real configs put these in a file and `include` it.

    server {
        listen      8080;
        server_name localhost;

        # --- POLICY 3: path-based routing to different services ------------
        # This is what fronts most platforms: one public hostname, many
        # backends chosen by path prefix.
        # Trailing slashes on BOTH sides -> the prefix is stripped.
        location /v1/agents/ {
            proxy_pass http://127.0.0.1:3001/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /v1/calls/ {
            proxy_pass http://127.0.0.1:3002/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # --- POLICY 4: auth via subrequest ---------------------------------
        # nginx calls /_authcheck internally BEFORE proxying. Non-2xx there
        # means 401/403 and the backend is never touched.
        # This is how nginx OSS does auth — there is no built-in JWT
        # validation (auth_jwt is NGINX Plus) and no native OIDC.
        location /private/ {
            auth_request /_authcheck;
            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /_authcheck {
            internal;                      # unreachable from outside
            proxy_pass http://127.0.0.1:3003/authcheck;
            proxy_pass_request_body off;   # only headers matter
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # --- POLICY 5: rate limiting applied -------------------------------
        # burst=5 allows a short spike; nodelay serves the burst immediately
        # instead of queueing it. Without nodelay, bursts are smoothed.
        location /limited/ {
            limit_req zone=perip burst=5 nodelay;
            limit_req_status 429;          # default is 503, which is a lie

            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # --- POLICY 6: caching applied -------------------------------------
        location /cached/ {
            proxy_cache apicache;
            proxy_cache_valid 200 30s;
            add_header X-Cache-Status $upstream_cache_status;  # HIT / MISS / EXPIRED

            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
