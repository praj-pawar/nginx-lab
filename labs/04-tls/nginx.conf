# Lab 4 — TLS termination. The proxy holds the certificate; the backend never
# learns that encryption was involved.
#
# Port 8443 rather than 443 so no sudo is needed.
#
#   nginx -p ~/nginx-lab/labs/04-tls -c ~/nginx-lab/labs/04-tls/nginx.conf

worker_processes 1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log logs/access.log;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    upstream backend_pool {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
        keepalive 16;
    }

    # Plain HTTP listener that does nothing but redirect to HTTPS.
    # This is the "ssl-redirect" behaviour every managed load balancer offers.
    server {
        listen      8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # The TLS listener.
    server {
        listen      8443 ssl;
        server_name localhost;

        ssl_certificate     certs/cert.pem;
        ssl_certificate_key certs/key.pem;

        # Modern defaults. In production these plus HSTS are the whole story.
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;
        ssl_session_timeout 10m;

        location / {
            # NOTE the scheme: http://. TLS ended at this server block. The hop
            # to the backend is PLAINTEXT. This is the normal arrangement and
            # the reason X-Forwarded-Proto has to exist.
            proxy_pass http://backend_pool;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # $scheme is now "https", so the backend can finally tell that the
            # client used TLS even though this connection did not.
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
