# Lab 6 — long lived connections. Where everything above stops being enough.
#
# Three things to observe:
#   1. buffering, which helps request/response APIs and hurts streams
#   2. proxy_read_timeout, which kills an idle connection the proxy thinks is dead
#   3. the WebSocket upgrade dance, which needs explicit config to work at all
#
#   nginx -p ~/nginx-lab/labs/06-streaming -c ~/nginx-lab/labs/06-streaming/nginx.conf

worker_processes 1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format st '$request -> upstream=$upstream_addr status=$status '
                  'sent=$body_bytes_sent duration=$request_time';
    access_log logs/access.log st;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    upstream backend_pool {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
        keepalive 16;
    }

    server {
        listen      8080;
        server_name localhost;

        # --- 1. Streaming WITH buffering (nginx's default) -----------------
        # nginx accumulates upstream data into buffers before forwarding.
        # Correct for APIs, because it frees the backend from feeding slow
        # clients. Wrong for streams, where it converts a steady trickle into
        # clumps. On loopback with tiny events the delay may be small; over a
        # real network with real payloads it is the difference between smooth
        # audio and choppy audio.
        location /stream-buffered {
            proxy_pass http://127.0.0.1:3001/stream;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_buffering on;
        }

        # --- 2. Streaming WITHOUT buffering -------------------------------
        # Pass bytes through as they arrive. Required for SSE, for token by
        # token LLM output, and for anything the user watches in real time.
        location /stream-live {
            proxy_pass http://127.0.0.1:3001/stream;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            # Some clients and intermediaries buffer on their own. This header
            # is a de facto convention asking them not to.
            add_header X-Accel-Buffering no;
        }

        # --- 3. A timeout deliberately set too low ------------------------
        # proxy_read_timeout is the gap allowed BETWEEN reads from upstream,
        # not a total request budget. Our /slow endpoint waits 10s before
        # sending anything, so a 3s timeout kills it and nginx returns 504.
        # This is the single most common cause of long requests failing behind
        # a proxy that works fine when called directly.
        location /slow-tight {
            proxy_pass http://127.0.0.1:3001/slow;
            proxy_set_header Host $host;
            proxy_read_timeout 3s;
        }

        # Same endpoint, patient timeout. Succeeds.
        location /slow-ok {
            proxy_pass http://127.0.0.1:3001/slow;
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        # --- 4. The WebSocket upgrade dance -------------------------------
        # An upgrade fails without all three of these. HTTP/1.1 is required,
        # and the Upgrade and Connection headers are hop-by-hop, so nginx does
        # not forward them unless told to. The long read timeout matters
        # because a live socket can sit idle between messages and the proxy
        # must not mistake silence for death.
        location /ws/ {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
