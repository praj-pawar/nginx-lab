# Lab 3 — L4 vs L7. The asterisk that explains the industry's confusion.
#
# `stream` is a SIBLING of `http`, not a child. It proxies raw TCP and never
# parses HTTP. That structural fact is why an L4 load balancer cannot route on
# a path, read a header, or add X-Forwarded-For.
#
# The demo: this listens on 9090 (L4) alongside 8080 (L7) so you can hit the
# same backends both ways and compare what arrives.
#
#   nginx -p ~/nginx-lab/labs/03-l4-vs-l7 -c ~/nginx-lab/labs/03-l4-vs-l7/nginx.conf

worker_processes 1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections 256;
}

# ============================================================================
# L4 — raw TCP. nginx moves bytes and has no idea they are HTTP.
# ============================================================================
stream {
    log_format l4 '$remote_addr -> $upstream_addr  bytes_sent=$bytes_sent';
    access_log logs/stream-access.log l4;

    upstream tcp_pool {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }

    server {
        listen 9090;
        proxy_pass tcp_pool;

        # Try adding any of these and run `nginx -t` — every one is REJECTED
        # here, because this context has no concept of an HTTP request:
        #
        #   location / { ... }                        <- unknown directive
        #   proxy_set_header X-Real-IP $remote_addr;  <- unknown directive
        #   proxy_pass http://tcp_pool;               <- no scheme allowed
        #
        # The failure IS the lesson. L4 has no headers to set and no paths to
        # match, so the directives do not exist.
    }
}

# ============================================================================
# L7 — same backends, but nginx parses HTTP and can act on it.
# ============================================================================
http {
    access_log logs/access.log;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    upstream http_pool {
        server 127.0.0.1:3001;
        server 127.0.0.1:3002;
        server 127.0.0.1:3003;
    }

    server {
        listen      8080;
        server_name localhost;

        # Path-based routing — impossible in `stream`.
        location /only-backend-1 {
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://http_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
